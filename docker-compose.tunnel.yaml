# nginx proxy address - http://172.17.0.1:64341

name: sentry
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: getsentry/sentry:latest
    container_name: sentry-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: sentry-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SENTRY_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-secret-min-32-chars}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${DB_CREATE_DATABASE_NAME:-sentry}
      SENTRY_DB_USER: ${DB_USER_NAME:-sentry}
      SENTRY_DB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_EMAIL_HOST: ${EMAIL_SERVER_HOST:-localhost}
      SENTRY_EMAIL_PORT: ${EMAIL_SERVER_PORT:-25}
      SENTRY_EMAIL_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SENTRY_EMAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SENTRY_EMAIL_USE_TLS: ${EMAIL_SERVER_USE_TLS:-false}
      SENTRY_SERVER_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
    volumes:
      - './volumes/data/sentry:/data:z'
    depends_on:
      sentry-db:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://sentry-app:9000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - sentry
      - cloudflare

  sentry-db:
    image: postgres:latest
    container_name: sentry-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: sentry-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: sentry-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-sentry}
      POSTGRES_USER: ${DB_USER_NAME:-sentry}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/sentry:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentry

  sentry-redis:
    image: redis:alpine
    container_name: sentry-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: sentry-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: sentry-redis
    volumes:
      - './volumes/db/redis/sentry:/data:z'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentry

networks:
  sentry:
    name: sentry
    external: false
  cloudflare:
    external: true
