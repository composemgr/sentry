# nginx proxy address - http://172.17.0.1:9000

name: sentry
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: getsentry/sentry:latest
    container_name: sentry-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      SENTRY_SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      SENTRY_POSTGRES_HOST: sentry-db
      SENTRY_DB_NAME: ${DB_CREATE_DATABASE_NAME:-sentry}
      SENTRY_DB_USER: ${DB_USER_NAME:-sentry}
      SENTRY_DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_EMAIL_HOST: ${EMAIL_SERVER_HOST:-localhost}
      SENTRY_EMAIL_PORT: ${EMAIL_SERVER_PORT:-25}
      SENTRY_EMAIL_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SENTRY_EMAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SENTRY_EMAIL_USE_TLS: ${EMAIL_SERVER_USE_TLS:-false}
      SENTRY_SERVER_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      CONTAINER_NAME: sentry-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:9000:9000'
    volumes:
      - './volumes/data/sentry:/data'
    depends_on:
      sentry-db:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    networks:
      - sentry
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://sentry-app:9000'
      - 'cloudflare.hostname=sentry.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.sentry-app.entrypoints=http'
      - 'traefik.http.routers.sentry-app-secure.tls=true'
      - 'traefik.http.routers.sentry-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.sentry-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.sentry-app.middlewares=sentry-app-https-redirect'
      - 'traefik.http.routers.sentry-app-secure.entrypoints=https'
      - 'traefik.http.routers.sentry-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.sentry-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.sentry-app-secure.service=sentry-app'
      - 'traefik.http.services.sentry-app.loadbalancer.server.port=9000'

  sentry-db:
    image: postgres:latest
    container_name: sentry-db
    hostname: sentry-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-sentry}
      POSTGRES_USER: ${DB_USER_NAME:-sentry}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: sentry-db
    volumes:
      - './volumes/data/db/postgres/sentry:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sentry

  sentry-redis:
    image: redis:alpine
    container_name: sentry-redis
    hostname: sentry-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    volumes:
      - './volumes/data/db/redis/sentry:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentry
    environment:
      CONTAINER_NAME: sentry-redis

networks:
  sentry:
    name: sentry
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
